[package]
name = "bob-json-parser"
version = "0.1.0"
edition = "2024"
description = "A hand-written JSON tokenizer and recursive-descent parser, with optional Python bindings"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bbelderbos/json_parser"
readme = "../README.md"
keywords = ["json", "parser", "pyo3", "python"]
categories = ["parser-implementations", "encoding"]
include = ["/src/**/*.rs", "/LICENSE-*"]

[lib]
name = "rust_json_parser"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"], optional = true }
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
criterion = "0.8.2"

[features]
python = ["pyo3", "serde_json"]
serde_json = ["dep:serde_json"]

[[bench]]
name = "parse_benchmark"
harness = false

[profile.bench]
debug = true
